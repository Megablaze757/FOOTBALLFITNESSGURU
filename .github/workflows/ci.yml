name: Tests

# Runs the pure-engine unit tests (readiness, trends, coach, constraints…) on
# every push. These engines decide what an athlete is told to do, so a red run
# here matters more than it looks: the app degrades to them whenever the AI
# backend is unavailable, and a wrong plan fails quietly rather than loudly.
#
# Deploys are NOT gated on this yet — wire `needs: test` into deploy.yml if you
# want a failing test to stop the site shipping.

on:
  push:
    # Every branch, not just main — the point of the tests is to catch a broken
    # engine before it reaches main, which means running them where the work is.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20: the test script passes a glob to `node --test`, and
      # expanding globs there only arrived in Node 22. On 20 it looks for a file
      # literally called "lib/**/*.test.ts" and exits 1 without running anything
      # — which is what the first CI run did.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck BEFORE the tests. `next build` is currently the only thing
      # that checks types, which means a missing import is discovered by the
      # deploy — the most expensive place to find it, and it blocks shipping
      # everything else in the push. This is the same check, thirty seconds
      # after the push instead.
      - run: npm run typecheck
      - run: npm test
