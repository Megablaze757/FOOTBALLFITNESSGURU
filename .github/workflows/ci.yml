name: Tests

# Runs the pure-engine unit tests (readiness, trends, coach, constraints…) on
# every push. These engines decide what an athlete is told to do, so a red run
# here matters more than it looks: the app degrades to them whenever the AI
# backend is unavailable, and a wrong plan fails quietly rather than loudly.
#
# Deploys ARE gated on this: deploy.yml calls this workflow via `workflow_call`
# and its build job `needs: test`, so a red run here stops the site shipping.

on:
  # Callable from deploy.yml, so the deploy gate runs exactly these checks
  # rather than a copy of them that can drift.
  workflow_call:
  push:
    # Every branch, not just main — the point of the tests is to catch a broken
    # engine before it reaches main, which means running them where the work is.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22, not 20: the test script passes a glob to `node --test`, and
      # expanding globs there only arrived in Node 22. On 20 it looks for a file
      # literally called "lib/**/*.test.ts" and exits 1 without running anything
      # — which is what the first CI run did.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck BEFORE the tests. `next build` is currently the only thing
      # that checks types, which means a missing import is discovered by the
      # deploy — the most expensive place to find it, and it blocks shipping
      # everything else in the push. This is the same check, thirty seconds
      # after the push instead.
      - run: npm run typecheck

      # Linting had never run before 2026-08-02: `next lint` with no config
      # drops into an interactive setup prompt, so it hung in CI and nobody got
      # past it locally. Config is committed (.eslintrc.json, rationale in
      # .eslintrc.README.md) and the tree is clean, so this can be blocking from
      # day one rather than accumulating a backlog nobody will ever clear.
      - run: npm run lint

      # Coverage is ENFORCED, not just reported. lib/ is the deterministic
      # engine layer — readiness, training load, calorie targets, rehab
      # constraints — and it is what the app falls back to whenever the AI
      # backend is unavailable. Thresholds sit just under the current figures
      # (98.5 line / 88.8 branch / 93.8 func) so this ratchets rather than
      # rubber-stamps: new engine code without tests drops the number and fails.
      - run: npm run test:coverage

      # Advisory, not blocking. Every current `npm audit` high is a Next.js
      # server-side advisory — Image Optimizer, Server Components, Middleware,
      # rewrites, Server Actions, Edge runtime — and this app is
      # `output: "export"`, a static bundle on GitHub Pages with no Next server
      # at runtime, so none of them is reachable in production. Failing the
      # build on unreachable advisories trains people to ignore the step; a
      # visible log they can read does not. See docs/PRODUCTION-READINESS.md.
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev || true
