name: Tests

# Runs the pure-engine unit tests (readiness, trends, coach, constraints…) on
# every push. These engines decide what an athlete is told to do, so a red run
# here matters more than it looks: the app degrades to them whenever the AI
# backend is unavailable, and a wrong plan fails quietly rather than loudly.
#
# Deploys ARE gated on this: deploy.yml calls this workflow via `workflow_call`
# and its build job `needs: test`, so a red run here stops the site shipping.

on:
  # Callable from deploy.yml, so the deploy gate runs exactly these checks
  # rather than a copy of them that can drift.
  workflow_call:
  push:
    # NOT main, and not the agent mirror branches.
    #
    # THIS WORKFLOW WAS RUNNING THREE TIMES PER COMMIT. deploy.yml calls it as
    # its gate on every push to main (`uses: ./.github/workflows/ci.yml`), and
    # `branches: ["**"]` then ran the identical checks again off the same push
    # — two full runs, unit suite and Playwright, for one commit. Pushing the
    # same commit to a mirror branch made it three.
    #
    # Excluding main loses nothing: the deploy gate runs exactly these checks
    # and blocks the deploy if they fail, which is the stronger guarantee. The
    # point of running on other branches — catching a broken engine before it
    # reaches main — is untouched.
    branches-ignore:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Rapid pushes supersede each other. Without this, three commits in a minute
# means three full runs and only the last one's result is ever looked at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22, not 20: the test script passes a glob to `node --test`, and
      # expanding globs there only arrived in Node 22. On 20 it looks for a file
      # literally called "lib/**/*.test.ts" and exits 1 without running anything
      # — which is what the first CI run did.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck BEFORE the tests. `next build` is currently the only thing
      # that checks types, which means a missing import is discovered by the
      # deploy — the most expensive place to find it, and it blocks shipping
      # everything else in the push. This is the same check, thirty seconds
      # after the push instead.
      - run: npm run typecheck

      # Linting had never run before 2026-08-02: `next lint` with no config
      # drops into an interactive setup prompt, so it hung in CI and nobody got
      # past it locally. Config is committed (.eslintrc.json, rationale in
      # .eslintrc.README.md) and the tree is clean, so this can be blocking from
      # day one rather than accumulating a backlog nobody will ever clear.
      - run: npm run lint

      # Coverage is ENFORCED, not just reported. lib/ is the deterministic
      # engine layer — readiness, training load, calorie targets, rehab
      # constraints — and it is what the app falls back to whenever the AI
      # backend is unavailable. Thresholds sit just under the current figures
      # (98.5 line / 88.8 branch / 93.8 func) so this ratchets rather than
      # rubber-stamps: new engine code without tests drops the number and fails.
      - run: npm run test:coverage

      # Advisory, not blocking. Every current `npm audit` high is a Next.js
      # server-side advisory — Image Optimizer, Server Components, Middleware,
      # rewrites, Server Actions, Edge runtime — and this app is
      # `output: "export"`, a static bundle on GitHub Pages with no Next server
      # at runtime, so none of them is reachable in production. Failing the
      # build on unreachable advisories trains people to ignore the step; a
      # visible log they can read does not. See docs/PRODUCTION-READINESS.md.
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev || true

  # END-TO-END: does the app actually boot, and is it still accessible?
  #
  # Separate job so it runs in parallel with the unit suite rather than adding
  # a browser download to the fast feedback path. It gates the deploy the same
  # way, because everything it catches is a whole-page failure: `lib/` is 98%
  # covered and none of it would notice a provider throwing on mount, a white
  # screen, or a colour choice that drops below AA.
  #
  # Runs against the real static export in out/, not `next dev` — that is the
  # artefact that ships, and dev mode differs from it in exactly the ways that
  # hide bugs.
  e2e:
    runs-on: ubuntu-latest
    # THE EXPENSIVE JOB, RUN WHERE IT PAYS.
    #
    # It downloads Chromium with system dependencies and does a full production
    # build — several minutes, against a unit suite that finishes in one. It
    # gates the deploy (workflow_call) and guards pull requests, which is where
    # a white screen would actually reach somebody. On a work-in-progress branch
    # push it is a browser download to tell you what `npm run build` already
    # would, and that is most of the runs.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Chromium only. The bugs this suite exists to catch are layout and
      # accessibility failures, which are not browser-specific, and three
      # engines would treble the run for no extra signal.
      - run: npx playwright install --with-deps chromium

      # Placeholder Supabase config: these tests never talk to a backend, but
      # the client throws at construction without a URL, and a page that dies
      # on load would fail every assertion for the wrong reason. Publishable
      # values only — nothing secret, and nothing that reaches a real project.
      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_e2e_placeholder

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
