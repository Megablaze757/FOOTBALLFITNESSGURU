name: Deploy Edge Functions

# Deploys supabase/functions/ from CI, so they can ship without installing the
# Supabase CLI, Deno or a local clone. Run it from the Actions tab.
#
# ONE-TIME SETUP — two repo secrets:
#
#   SUPABASE_ACCESS_TOKEN   supabase.com/dashboard/account/tokens → Generate new
#   GROQ_API_KEY            console.groq.com/keys
#
#   OPENROUTER_API_KEY is optional. The provider chain skips a provider with no
#   key rather than failing, so Groq alone works — OpenRouter just adds a
#   fallback for when Groq is rate-limited or down.
#
# Why this exists at all: for a while the meal photo estimator had no working
# backend — the Worker's chain was eight text-only models and its /health
# reported no `vision`, so photos had nowhere to go.
#
# THAT IS NO LONGER TRUE, and this comment said otherwise for long enough to
# mislead someone reading it as current. Worker 2026-08-09.2 carries two vision
# models, and lib/api.ts routed photos back to it on its own, exactly as the
# design intended — meal photos work today with no Supabase function deployed.
#
# Check `/health` before believing any claim about what the Worker can do. Its
# source is not in this repository, so it changes without a commit here to
# record it, and a comment is not evidence.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Space-separated function names to deploy"
        type: string
        default: "estimate-food"
      set_secrets:
        description: "Also push GROQ_API_KEY / OPENROUTER_API_KEY to Supabase"
        type: boolean
        default: true
      # For announce-launch. Left blank it changes nothing, and the function
      # falls back to REMINDER_FROM — already set for the two reminder jobs — so
      # the common case needs no new secret at all.
      launch_from:
        description: "Sender for the launch email, e.g. Pocket Athlete <hello@pocketathlete.com> (blank = leave as is)"
        type: string
        default: ""
      app_url:
        description: "Public site URL, used for links in emails (blank = leave as is)"
        type: string
        default: ""

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Not a secret: the project ref is in the shipped browser bundle already.
      PROJECT_REF: txqhstackgidjqkkrzyj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Generate one at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Named explicitly rather than deploying everything in the directory. A
      # blanket deploy would also ship the scheduled jobs and the Stripe
      # webhook, which are currently served by the Worker — two live handlers
      # for the same webhook is not a thing to switch on by accident.
      # SOME FUNCTIONS MUST BE DEPLOYED WITH JWT VERIFICATION OFF, and getting
      # that wrong is invisible until somebody's data silently stops arriving.
      #
      # wearable-ingest is called by an Apple Shortcut, sync-oura by a cron job
      # and stripe-webhook by Stripe — none of which has a Supabase session or
      # any way to get one. With verification left on, Supabase rejects the
      # request BEFORE the function runs, so every morning sync 401s and the
      # function's own logs show nothing at all.
      #
      # It is not a hole: each of these authenticates itself. wearable-ingest
      # checks the athlete's ingest token, sync-oura a CRON_SECRET, and
      # stripe-webhook the Stripe signature. Their headers say so.
      #
      # Read from the source rather than kept as a list here, so a new function
      # that documents the requirement gets it automatically instead of waiting
      # for somebody to remember this file exists.
      - name: Deploy
        run: |
          set -euo pipefail
          for fn in ${{ inputs.functions }}; do
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "::error::supabase/functions/$fn does not exist"
              exit 1
            fi
            flags=""
            if grep -q -- "--no-verify-jwt" "supabase/functions/$fn/index.ts"; then
              flags="--no-verify-jwt"
              echo "$fn documents --no-verify-jwt, deploying with it"
            fi
            echo "::group::deploying $fn $flags"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $flags
            echo "::endgroup::"
          done

      # Skipped silently when a key isn't configured — the chain treats an
      # absent provider as "skip", not "fail", so deploying with only one of the
      # two is a supported setup rather than a broken one.
      - name: Set model keys
        if: inputs.set_secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GROQ_API_KEY:-}" ]; then
            supabase secrets set "GROQ_API_KEY=$GROQ_API_KEY" --project-ref "$PROJECT_REF"
            echo "GROQ_API_KEY set"
          else
            echo "::warning::GROQ_API_KEY not configured — Groq will be skipped"
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            supabase secrets set "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" --project-ref "$PROJECT_REF"
            echo "OPENROUTER_API_KEY set"
          else
            echo "OPENROUTER_API_KEY not configured — Groq only, no fallback"
          fi
          if [ -z "${GROQ_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Neither model key is set, so every AI call will fail."
            exit 1
          fi

      # These are not secrets — a From address appears in every email it sends
      # and the site URL is on the tin. They are inputs rather than repo secrets
      # so this can be run start to finish from a phone, without first creating
      # anything in the Settings screens.
      - name: Set mail settings
        if: inputs.launch_from != '' || inputs.app_url != ''
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.launch_from }}" ]; then
            supabase secrets set "LAUNCH_FROM=${{ inputs.launch_from }}" --project-ref "$PROJECT_REF"
            echo "LAUNCH_FROM set"
          fi
          if [ -n "${{ inputs.app_url }}" ]; then
            supabase secrets set "APP_URL=${{ inputs.app_url }}" --project-ref "$PROJECT_REF"
            echo "APP_URL set"
          fi

      # Proves it answers, rather than reporting success because the CLI exited
      # 0. An undeployed function 404s the CORS preflight; a deployed one does
      # not. Same probe the app itself uses to decide whether to offer photos.
      - name: Verify each function answers
        run: |
          set -euo pipefail
          fail=0
          for fn in ${{ inputs.functions }}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -X OPTIONS \
              "https://$PROJECT_REF.supabase.co/functions/v1/$fn")
            if [ "$code" = "404" ]; then
              echo "::error::$fn still 404s after deploying"
              fail=1
            else
              echo "$fn answers ($code)"
            fi
          done
          exit $fail
