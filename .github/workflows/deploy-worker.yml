name: Check API Worker

# ============================================================================
# THIS WORKFLOW NO LONGER DEPLOYS.
#
# apex-api is now ONE Worker serving PocketAthlete AND Clipper, so both apps
# share the same AI keys and Groq -> OpenRouter -> NVIDIA fallbacks. It is
# built and deployed from Megablaze757/clipfarm (apps/worker), which contains
# a copy of cloudflare/src + lib from this repo.
#
# Deploying cloudflare/ from here would replace that merged Worker with a
# PocketAthlete-only one and take Clipper's routes, R2 binding and cron down
# with it. So this job only typechecks.
#
# To ship a PocketAthlete Worker change:
#   1. merge it here as usual;
#   2. in clipfarm:  node scripts/sync-pocketathlete.mjs ../FOOTBALLFITNESSGURU
#   3. commit, push, and deploy from clipfarm (apps/worker: npx wrangler deploy,
#      or its "Deploy apex-api Worker" Action).
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "lib/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "lib/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      # Catch type errors here rather than discovering them after the sync.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Reminder — deploy from clipfarm
        run: |
          echo "::notice title=Not deployed::apex-api is deployed from Megablaze757/clipfarm. Sync this change there with scripts/sync-pocketathlete.mjs, then deploy from clipfarm."
