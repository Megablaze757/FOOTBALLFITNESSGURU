name: Deploy API Worker

# Deploys cloudflare/ to Cloudflare Workers from CI, so the Worker can ship
# without Node or wrangler installed locally.
#
# Secrets already set with `wrangler secret put` (OPENROUTER_API_KEY,
# SUPABASE_ANON_KEY, Stripe, email…) are stored on Cloudflare's side and SURVIVE
# a redeploy — this workflow never sees them and cannot overwrite them. The
# `[vars]` block in wrangler.toml is the part each deploy replaces.
#
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN (Cloudflare dashboard →
# My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template).
#
# THE DRIFT GATE BELOW IS NOT OPTIONAL, and it used to make this workflow
# impossible. It compared the deployed and repo versions for EQUALITY and
# refused on any difference — so bumping the version to ship a fix was refused
# because they now differed, and not bumping it left nothing to ship. Every push
# to cloudflare/ failed this job, the red X became scenery, and the Worker got
# pasted into the dashboard by hand instead: precisely the hand-editing the gate
# exists to protect against.
#
# It now compares them in ORDER. Repo ahead deploys, which is the whole point of
# this workflow; production ahead refuses, because those changes exist nowhere
# else. See scripts/worker-drift.mjs and lib/worker-drift.test.ts.
#
# `npm run deploy` has a predeploy hook that checks the same thing, but
# wrangler-action does not go through npm, so the check has to be repeated here.

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if the live Worker differs from this repo (overwrites it)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level so the steps below can branch on whether the token exists — the
    # `secrets` context isn't available in a step's own `if`.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      # Catch type errors here rather than discovering them as a 500 in the
      # athlete's browser — a broken Worker degrades silently to the on-device
      # engine, which is exactly the failure you don't notice.
      - name: Typecheck
        run: npx tsc --noEmit

      # Refuses when the deployed Worker is not the one in this repo — and also
      # when it cannot tell, because deploying without knowing what you are
      # about to overwrite is the whole risk. Override deliberately by running
      # the workflow with `force` set.
      - name: Refuse to overwrite a NEWER Worker
        if: env.CF_TOKEN != '' && inputs.force != true
        working-directory: .
        run: node scripts/worker-drift.mjs "$WORKER_URL"
        env:
          # Public — it is baked into the shipped browser bundle.
          WORKER_URL: https://apex-api.fitnessguru.workers.dev

      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare

      # Without the token there's nothing to deploy to, and failing the run
      # would put a permanent red X on main — which teaches you to ignore red,
      # the one habit that makes CI worthless. Typecheck still ran above.
      - name: No deploy token — skipped
        if: env.CF_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed."
          echo "The code was typechecked. Add the secret to deploy automatically,"
          echo "or keep pasting cloudflare/src/index.ts into the dashboard by hand."
