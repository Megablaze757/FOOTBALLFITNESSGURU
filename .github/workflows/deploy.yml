name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # THE SITE DOES NOT SHIP IF THE ENGINES ARE BROKEN.
  #
  # Deploys used to run regardless of the test suite — ci.yml even said so in a
  # comment, inviting someone to wire this up one day. The engines in lib/ are
  # what the app degrades to whenever the AI backend is unavailable, and a wrong
  # training plan or calorie target fails quietly rather than loudly. That is
  # precisely the class of bug a green pipeline must not wave through.
  #
  # Reusing ci.yml rather than copying its steps, so the gate can never drift
  # from the checks it is supposed to be enforcing.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in step with the test workflow and package.json engines. Next 14
      # supports 22; a version split between building and testing is how you
      # get a green test run and a broken build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Empty, because the site is served from the root of pocketathlete.com.
          # A non-empty base path here 404s every stylesheet and script on the
          # site — that is what broke the first custom-domain deploy. Only set
          # the NEXT_PUBLIC_BASE_PATH repo Variable if you ever go back to
          # serving from https://<user>.github.io/<repo>/.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          # Public client values — override by setting repo Variables of the same name.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://txqhstackgidjqkkrzyj.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_kr26XwyR0HZxS3HR3UJI2Q_YLLT7Sfl' }}
          # Optional: your Cloudflare Worker URL (unlocks AI/Stripe/email). Set a repo Variable of this name.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
          # Web push. The PUBLIC half of the VAPID pair from scripts/gen-vapid.mjs —
          # safe to expose, it's what browsers subscribe against. Without it the
          # reminder toggle renders nothing at all, which looks like a bug rather
          # than missing config. It MUST match VAPID_PUBLIC_KEY on the Worker, or
          # browsers subscribe against one key while the Worker signs with another
          # and every push is rejected with 403.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
        run: |
          npm run build
          touch out/.nojekyll
          # The Pages artifact is `out/`, so a CNAME sitting in the repo root
          # never reaches the deployment and the custom domain gets dropped on
          # the next deploy. Copy it in.
          if [ -f CNAME ]; then cp CNAME out/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
