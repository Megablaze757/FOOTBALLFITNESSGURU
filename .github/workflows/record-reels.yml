name: Record reels

# Makes the social videos. Nobody films anything, nobody reads a teleprompter,
# and nothing is uploaded automatically — the finished MP4s come back as
# artefacts to look at before anybody posts one.
#
# WHY HERE AND NOT ON A LAPTOP. Two things this needs exist on a runner and
# not necessarily anywhere else: a full ffmpeg (Playwright bundles a VP8-only
# build with no audio support at all, so it can record and cannot mux), and a
# machine that can sign in to the app without anybody's own account.
#
# Manual by default. A reel that nobody looked at before it went out is worse
# than no reel, and a schedule that produces one every morning is a folder of
# artefacts nobody opens.

on:
  # ═════════════════════════════════════════════════════════════════════════
  # THE ADMIN PANEL'S BUTTON LANDS HERE.
  #
  # repository_dispatch and not workflow_dispatch: they do the same job and
  # need different permissions. workflow_dispatch wants Actions: write on the
  # token; repository_dispatch wants Contents: write, which is exactly what the
  # publish-cues token already has. One button, no second setup step, and no
  # widening of what that credential can do.
  # ═════════════════════════════════════════════════════════════════════════
  repository_dispatch:
    types: [record-reel]

  workflow_dispatch:
    inputs:
      script:
        description: "Which reel (demo-readiness, demo-cost, drill, standards)"
        type: string
        default: "demo-cost"
      voice:
        description: "Narrate it. Off records a silent reel with captions."
        type: boolean
        default: true

jobs:
  record:
    runs-on: ubuntu-latest
    # RESOLVED ONCE, at the top. Two triggers carry the same values in
    # different places, and a workflow that reaches for both at every use is a
    # workflow where one of them is eventually forgotten.
    env:
      SCRIPT: ${{ inputs.script || github.event.client_payload.script || 'demo-cost' }}
      SUBJECT: ${{ github.event.client_payload.subject || '' }}
      # A STRING on both paths. A GitHub expression comparing a JSON boolean
      # from client_payload against a workflow input is a comparison nobody can
      # read and half the internet gets wrong.
      VOICE: ${{ github.event.client_payload.voice || (inputs.voice && 'true') || 'false' }}
    steps:
      # ═══════════════════════════════════════════════════════════════════
      # WHAT IS CONFIGURED, BEFORE THREE MINUTES ARE SPENT FINDING OUT.
      #
      # A missing secret was discovered at the LAST step of a run that then
      # reported success: the reel was made, nothing appeared in the app, and
      # the only clue was a skipped step nobody scrolls to. Names and
      # set/not-set only — never a value.
      # ═══════════════════════════════════════════════════════════════════
      - name: What is configured
        env:
          RAW_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://txqhstackgidjqkkrzyj.supabase.co' }}
          RAW_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_kr26XwyR0HZxS3HR3UJI2Q_YLLT7Sfl' }}
          RAW_API: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
        run: |
          echo "REEL_EMAIL:    ${{ secrets.REEL_EMAIL != '' && 'set' || 'NOT SET' }}"
          echo "REEL_PASSWORD: ${{ secrets.REEL_PASSWORD != '' && 'set' || 'NOT SET' }}"
          echo ""
          echo "Both must be repository SECRETS — Settings → Secrets and variables → Actions,"
          echo "the Secrets tab rather than Variables. Names are exact and case-sensitive."
          echo ""

          # ───────────────────────────────────────────────────────────────
          # THE TRAILING NEWLINE, REMOVED ONCE, HERE.
          #
          # NEXT_PUBLIC_SUPABASE_URL was saved with a carriage return on the
          # end. Invisible in the settings box, invisible in the log, and
          # fatal: curl answered "URL rejected: Malformed input to a URL
          # function" and quit before making a request. Three runs recorded a
          # reel perfectly and put none of them in the dashboard because of one
          # character nobody could see.
          #
          # Copy-and-paste is how every one of these gets configured, so a
          # stray newline is the NORMAL case. Stripped once, up front, and
          # every later step reads the cleaned value out of $GITHUB_ENV — a
          # second place to fix is a second place to forget.
          # ───────────────────────────────────────────────────────────────
          url=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          key=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          api=$(printf '%s' "$RAW_API" | tr -d '[:space:]')

          if [ "$url" != "$RAW_URL" ] || [ "$key" != "$RAW_KEY" ]; then
            echo "::warning::A repository VARIABLE has whitespace in it (usually a newline from a paste)."
            echo "::warning::This run strips it, so nothing breaks — but re-saving the variable without"
            echo "::warning::the trailing newline is worth doing: Settings -> Secrets and variables -> Actions -> Variables."
          fi

          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::NEXT_PUBLIC_SUPABASE_URL does not look like a Supabase URL: $url"; exit 1 ;;
          esac

          echo "Supabase URL:  $url"
          {
            echo "SUPABASE_URL=$url"
            echo "SUPABASE_KEY=$key"
            echo "SUPABASE_API=$api"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # ═══════════════════════════════════════════════════════════════════
      # ffmpeg, WHICH THE RUNNER DOES NOT HAVE.
      #
      # This workflow was written asserting "CI runners have one", which was
      # wrong and cost three runs: the recording worked every time — webm, wav
      # and srt all produced — and then died on `ffmpeg: command not found` at
      # the one step that turns them into something postable.
      #
      # Playwright bundles a VP8-only build with no audio support at all, so
      # this is a real install rather than a path fix.
      # ═══════════════════════════════════════════════════════════════════
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264 || {
            echo "::error::ffmpeg installed without libx264 — the MP4 would not be postable"; exit 1; }

      # The real credentials, so the export it films is the real app. Both are
      # public — the publishable key is in the shipped bundle by design.
      - name: Build the site to film
        run: npm run build
        env:
          # From $GITHUB_ENV, already stripped of paste damage above. A URL with
          # a carriage return in it would be baked into the bundle and every
          # request the filmed app makes would fail.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ env.SUPABASE_API }}

      # 325MB, and it never changes. Downloading it on every run is most of the
      # job's time and all of it is avoidable.
      - name: Cache the voice model
        if: env.VOICE == 'true'
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: .voice
          key: kokoro-v1.0

      - name: Fetch the voice model
        if: env.VOICE == 'true' && steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .voice
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o .voice/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          curl -sSfL -o .voice/voices-v1.0.bin  "$base/voices-v1.0.bin"

      - name: Install the voice
        if: env.VOICE == 'true'
        run: pip install --quiet kokoro-onnx soundfile

      - name: Serve the export
        run: |
          python3 -m http.server 8899 --directory out &
          # Waited for, not slept on: a fixed sleep is either too short and the
          # first navigation fails, or wasted on every run that did not need it.
          for _ in $(seq 1 40); do curl -sf http://localhost:8899/ >/dev/null && break; sleep 0.25; done

      - name: Record
        run: |
          node --import tsx scripts/record-reel.mts "$SCRIPT" \
            $([ "$VOICE" = "true" ] && echo --voice) \
            $([ -n "$SUBJECT" ] && echo --subject "$SUBJECT") \
            --out reels
        env:
          KOKORO_MODEL: .voice/kokoro-v1.0.onnx
          KOKORO_VOICES: .voice/voices-v1.0.bin
          # A DEDICATED DEMO ACCOUNT. Never a real athlete's: no real training,
          # food or body data goes near a video. Unset simply films the public
          # pages, which is a worse reel and not a broken one.
          REEL_EMAIL: ${{ secrets.REEL_EMAIL }}
          REEL_PASSWORD: ${{ secrets.REEL_PASSWORD }}

      # H.264 in an MP4 is what the platforms accept. The runner's ffmpeg can
      # do it; Playwright's cannot.
      #
      # ═══════════════════════════════════════════════════════════════════
      # THE UPSCALE HAPPENS HERE, because ffmpeg can actually resample.
      #
      # Playwright records at the CSS viewport size (540x960). Asking it for
      # 1080x1920 does NOT scale the page up — it pads the canvas and leaves
      # the app sitting in the top-left quarter, which is what shipped: three
      # quarters of every frame empty. So the recorder captures 540x960 and
      # this scales it to the 1080x1920 the platforms want.
      #
      # lanczos rather than the default bicubic: this is a 2x upscale of text,
      # which is the case bicubic softens most.
      # ═══════════════════════════════════════════════════════════════════
      - name: Mux to MP4
        if: env.VOICE == 'true'
        run: |
          id="$SCRIPT"
          lead=$(cat reels/*.lead 2>/dev/null || echo 0)
          ffmpeg -hide_banner -loglevel error -y -ss "$lead" -i reels/*.webm -i reels/*.wav \
            -vf "scale=1080:1920:flags=lanczos" \
            -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -c:a aac -b:a 128k \
            -shortest "reels/$id.mp4"

      - name: Mux silent
        if: env.VOICE != 'true'
        run: |
          ffmpeg -hide_banner -loglevel error -y -i reels/*.webm \
            -vf "scale=1080:1920:flags=lanczos" \
            -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -an "reels/$SCRIPT.mp4"

      # ═══════════════════════════════════════════════════════════════════
      # BACK INTO THE APP, WHICH IS THE WHOLE POINT.
      #
      # "I want it in admin dashboard not github." An artefact means opening
      # GitHub, finding the run, downloading a zip and unzipping it — to watch
      # a twenty-second video the app asked for in the first place.
      #
      # Signed in as the SAME demo account that filmed it, so there is no new
      # credential: these are the secrets that already exist. The bucket is
      # private and admin-read (migration 0111).
      #
      # Not fatal if it fails. The artefact below is still there, and losing a
      # reel to a storage hiccup should not lose the run that made it.
      # ═══════════════════════════════════════════════════════════════════
      # NO `if:` GATE. A step that skips itself reports success and leaves a
      # green run with nothing in the app and no line saying why — which is
      # exactly what happened. The check belongs inside the step, beside the
      # thing it is checking for, where it can say what to do about it.
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ env.SCRIPT }}
          path: |
            reels/*.mp4
            reels/*.srt
          retention-days: 14

      # ═══════════════════════════════════════════════════════════════════
      # THE ARTEFACT IS SAVED FIRST, AND THE DASHBOARD UPLOAD MAY FAIL LOUDLY.
      #
      # It was the other way round, under `continue-on-error: true` — which
      # reports a FAILED step as SUCCESS in the job listing. The carousel run
      # that could not upload a single slide (the bucket rejected image/png)
      # showed a green tick, and I have already once read a listing like that
      # and told somebody the upload worked.
      #
      # Saving the artefact first means nothing is lost when the upload fails,
      # so the upload no longer needs to swallow its own failure to protect it.
      # ═══════════════════════════════════════════════════════════════════
      - name: Put it in the dashboard
        env:
          REEL_EMAIL: ${{ secrets.REEL_EMAIL }}
          REEL_PASSWORD: ${{ secrets.REEL_PASSWORD }}
          # SUPABASE_URL and SUPABASE_KEY come from $GITHUB_ENV, cleaned.
        run: |
          set -uo pipefail

          # A newline cannot be typed into a password field, so one here is
          # always paste damage. Spaces are NOT stripped — a password may
          # legitimately end in one, and silently trimming it would break a
          # working credential — but they are reported, because an invisible
          # trailing space is otherwise an unexplainable HTTP 400.
          REEL_EMAIL=$(printf '%s' "$REEL_EMAIL" | tr -d '\r\n')
          REEL_PASSWORD=$(printf '%s' "$REEL_PASSWORD" | tr -d '\r\n')
          case "$REEL_PASSWORD" in
            " "*|*" ") echo "::warning::REEL_PASSWORD starts or ends with a space. If sign-in fails, that is why." ;;
          esac
          if [ -z "${REEL_EMAIL:-}" ] || [ -z "${REEL_PASSWORD:-}" ]; then
            echo "::warning::REEL_EMAIL/REEL_PASSWORD are empty, so the reel was not uploaded to the dashboard."
            echo "::warning::They must be repository SECRETS (Settings -> Secrets and variables -> Actions -> Secrets),"
            echo "::warning::named exactly REEL_EMAIL and REEL_PASSWORD. A Variable of the same name will not work."
            echo "::warning::The MP4 is still attached to this run as an artefact."
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────
          # STATUS AND BODY, SEPARATELY.
          #
          # This was one line: curl piped straight into a JSON parser. When the
          # response was not JSON the run's entire explanation was a Python
          # traceback ending "Expecting value: line 1 column 1" — which says
          # nothing about sign-in, nothing about which request, and nothing
          # about what to do. A parser is not an error handler.
          #
          # The body is printed only on failure and only its first line, because
          # a Supabase auth error names the reason ("invalid_grant",
          # "email_not_confirmed") without ever echoing what was sent.
          # ─────────────────────────────────────────────────────────────────
          #
          # `|| echo "000"` APPENDED to curl's own output rather than replacing
          # it: curl already prints 000 through -w when it fails, so a failure
          # produced the code "000000", which matched no case below and left
          # the run with a bare "HTTP 000000" and no explanation at all. The
          # exit status is captured separately now.
          auth=$(mktemp)
          body=$(python3 -c 'import json,os; print(json.dumps({"email": os.environ["REEL_EMAIL"], "password": os.environ["REEL_PASSWORD"]}))')
          if ! code=$(curl -sS -o "$auth" -w "%{http_code}" \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data-raw "$body" 2>"$auth.err"); then
            code="000"
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Sign-in to Supabase failed (HTTP $code) — the reel was not uploaded to the dashboard."
            case "$code" in
              000) echo "::error::The request did not complete at all. Check NEXT_PUBLIC_SUPABASE_URL."
                   head -c 200 "$auth.err" 2>/dev/null | tr -d '\n'; echo ;;
              400) echo "::error::Supabase rejected the credentials. Check REEL_EMAIL and REEL_PASSWORD, and that the account is confirmed." ;;
              401|403) echo "::error::The publishable key was refused. Check NEXT_PUBLIC_SUPABASE_ANON_KEY." ;;
            esac
            head -c 200 "$auth" | tr -d '\n'; echo
            echo "::warning::The MP4 is still attached to this run as an artefact."
            # FAILS THE JOB. The artefact is already saved above, so there is
            # nothing left to protect by pretending this worked.
            exit 1
          fi

          token=$(python3 -c "import json;print(json.load(open('$auth')).get('access_token',''))" 2>/dev/null || echo "")
          if [ -z "$token" ]; then
            echo "::error::Signed in but no access token came back — cannot upload."
            exit 1
          fi

          # Named by script and day, so a second run of the same reel does not
          # replace the first — comparing two takes is the normal case.
          stamp=$(date -u +%Y-%m-%dT%H-%M)
          uploaded=0
          for file in reels/*.mp4 reels/*.srt; do
            [ -e "$file" ] || continue
            name="$SCRIPT-$stamp.${file##*.}"
            type=$([ "${file##*.}" = "mp4" ] && echo video/mp4 || echo application/x-subrip)
            out=$(mktemp)
            if ! up=$(curl -sS -o "$out" -w "%{http_code}" -X POST \
              "$SUPABASE_URL/storage/v1/object/reels/$name" \
              -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $token" \
              -H "Content-Type: $type" --data-binary "@$file"); then
              up="000"
            fi
            if [ "$up" = "200" ]; then
              echo "$name uploaded"
              uploaded=$((uploaded + 1))
            else
              echo "::error::$name did not upload (HTTP $up)."
              head -c 200 "$out" | tr -d '\n'; echo
              # The overwhelmingly likely cause, named rather than guessed at.
              echo "::error::If this says the bucket is missing, run supabase/apply-0088-0111.sql."
            fi
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::Nothing reached the dashboard. The MP4 is attached to this run."
            exit 1
          fi
