  <text x="72" y="552" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#e3b53f">2</text>
  <text x="120" y="552" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#e2e8f0">Take the return with your far foot, away from</text>
