  <text x="72" y="658" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#e3b53f">3</text>
  <text x="120" y="658" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#e2e8f0">Play it back first time, alternating feet</text>
