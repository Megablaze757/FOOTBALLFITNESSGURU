<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416"/><stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d365"/><stop offset="100%" stop-color="#c9962f"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="322" y="342" width="436" height="676" rx="36"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#gold)"/>

  <text x="72" y="180" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Built for your position,</text>
  <text x="72" y="240" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#ffffff">not just your sport.</text>

  <!-- Phone chassis -->
  <rect x="310" y="330" width="460" height="700" rx="48" fill="#1c1c1f" stroke="#2f2f34" stroke-width="2"/>
  <rect x="322" y="342" width="436" height="676" rx="36" fill="#0a0a0b"/>
  <g clip-path="url(#screen)">
    <text x="350" y="432" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#e2e8f0">Week 2 · Build</text>
    <text x="350" y="466" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8391a6">Winger · Speed block</text>
    <rect x="350" y="502" width="380" height="88" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="350" y="540" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Back squat</text>
    <text x="350" y="570" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8391a6">4 × 6 @ RPE 7</text>
    
    <rect x="350" y="606" width="380" height="88" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="350" y="644" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Nordic curl</text>
    <text x="350" y="674" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8391a6">3 × 5 slow</text>
    
    <rect x="350" y="710" width="380" height="88" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="350" y="748" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Crossing off the dribble</text>
    <text x="350" y="778" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8391a6">5 × 6 each side</text>
    <rect x="634" y="732" width="76" height="28" rx="14" fill="#e3b53f" fill-opacity="0.16"/><text x="672" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e3b53f">SKILL</text>
    <rect x="350" y="814" width="380" height="88" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="350" y="852" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Pogo hops</text>
    <text x="350" y="882" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8391a6">3 × 20s</text>
    
    <rect x="350" y="932" width="380" height="76" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="350" y="980" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#34d399">No leg machines — as you asked.</text>
  </g>
  <!-- Notch -->
  <rect x="485" y="352" width="110" height="26" rx="13" fill="#1c1c1f"/>

  <text x="72" y="1028" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#8391a6">pocketathlete.com</text>
  <text x="1008" y="1028" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#e3b53f">PocketAthlete</text>
</svg>