name = "apex-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 08:00 UTC: check-in, deadline, weekly and trial reminders.
# 19:00 UTC: only the workout/rest-day logging reminder.
[triggers]
crons = ["0 8 * * *", "0 19 * * *"]

# Non-secret defaults. Point these at your project.
[vars]
# Model chain: OPENROUTER_MODEL (paid) is tried FIRST, then these free slugs as
# fallback, then the browser's on-device engine. All on ONE OpenRouter key,
# which is why this stays within their terms — no stacking of other vendors'
# free tiers behind a proxy.
#
# Free-first was the original design and it was a false economy: the free tiers
# are rate-limited, slower and the likeliest to ignore "reply with JSON only",
# so the usual path was several failed attempts before reaching the model that
# was always going to answer. 22 calls on the paid model cost $0.0015.
#
# NOTE: the Worker is pasted into the Cloudflare dashboard by hand, and that
# does NOT apply anything in this [vars] block — it has to be set in the
# dashboard too. Because that never happened, this var was unset in production
# and there was no fallback chain at all. The Worker now carries these same
# defaults in code so a fallback exists whether or not this is configured.
#
# Slugs verified live on 2026-07-28; free models get retired often, and a dead
# slug costs one wasted attempt.
# INERT as of 2026-08-04: these never run. Every AI route requires silver, and
# the "skip the free rungs" priority flag is also silver-or-above, so the free
# list is always empty by the time the chain executes. Verified against the
# built Worker. They become live again only if an AI feature is opened to
# bronze. Groq is the free-and-fast path now.
OPENROUTER_FREE_MODELS = "nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-20b:free,google/gemma-4-31b-it:free"

# A REAL OpenRouter model slug. "deepseek/deepseek-v4-flash" was invalid, so
# every AI call 4xx'd and the coach silently fell back to the on-device engine.
# deepseek-chat is cheap and capable; confirm the exact slug at
# https://openrouter.ai/models if you swap it.
OPENROUTER_MODEL = "deepseek/deepseek-chat"

# --- The provider ladder ---------------------------------------------------
# Order is Groq -> OpenRouter -> NVIDIA, fastest first, and a provider is on the
# ladder ONLY if its key is set. That key is the whole switch — there is no
# AI_PROVIDER variable, so you can never select a provider you have no key for.
#
# Defaults for everything below live in code, so leaving them unset here is fine
# — and, given this block is never applied to the hand-pasted Worker, is what
# actually happens in production.

# Groq: primary. Currently on the FREE tier (developer plans sold out), so the
# per-token prices stay blank and Groq calls are counted as costing nothing.
# Set them if you move to a paid plan, or spend goes invisible. (The per-user
# daily call cap still applies either way.)
# llama leads, not gpt-oss: gpt-oss is a REASONING model, its thinking is billed
# against max_tokens, and it was returning finish_reason "length" with empty
# content — which reads as "all models failed".
GROQ_MODEL = "llama-3.3-70b-versatile"
GROQ_FALLBACK_MODELS = "openai/gpt-oss-120b"
# GROQ_PROMPT_PER_M = ""
# GROQ_COMPLETION_PER_M = ""

# NVIDIA: last-resort rung. Measured slower than OpenRouter for this app, so it
# sits at the bottom — a slow rung in the MIDDLE would delay the fallback
# without ever being the one that answers. Same free-tier pricing note as Groq.
NVIDIA_MODEL = "meta/llama-3.3-70b-instruct"
NVIDIA_FALLBACK_MODELS = "nvidia/llama-3.3-nemotron-super-49b-v1"
# NVIDIA_PROMPT_PER_M = ""
# NVIDIA_COMPLETION_PER_M = ""

# Vision models, for the meal-photo path only. A SEPARATE chain because the text
# primary above cannot see: sending it an image does not fail usefully, it
# answers about nothing and then every remaining rung does the same until the
# time budget is gone. /health reports which one is live.
#
# These two are the compiled defaults as well, so leaving them unset is fine.
# GROQ_VISION_MODELS is deliberately empty: no Groq vision slug could be
# verified against their catalogue, and an unverified default 404s every photo.
OPENROUTER_VISION_MODELS = "google/gemini-2.5-flash,openai/gpt-4.1-mini"
AI_DAILY_LIMIT = "40"   # max AI coach calls per user per day; over this, the on-device engine is used

# Free trial on the first paid subscription, in days. 0 turns it off. Only
# granted to someone with no prior Stripe subscription, so cancelling and
# resubscribing can't farm repeat trials.
TRIAL_DAYS = "14"

# Price of the PAID model, USD per million tokens. Used to cost every request
# against the user's monthly budget when OpenRouter doesn't report a figure
# itself. These match deepseek/deepseek-chat as of 2026-07-25 — if you change
# OPENROUTER_MODEL you MUST change these, or spend is silently under-counted and
# the cap stops capping. Check the model's pricing at https://openrouter.ai/models
PAID_PROMPT_PER_M     = "0.2002"
PAID_COMPLETION_PER_M = "0.8001"
SUPABASE_URL = "https://txqhstackgidjqkkrzyj.supabase.co"
APP_URL = "https://pocketathlete.com"
REMINDER_FROM = "PocketAthlete <info@pocketathlete.com>"

# Stripe price IDs. These are NOT secret — a price_... id is safe in public code
# (Stripe exposes them client-side), so they live here as plain vars rather than
# wrangler secrets. Paste your live IDs from the Stripe dashboard (Products → the
# product → Pricing → the price_... id). Test-mode and live-mode ids differ; use
# the pair that matches whichever STRIPE_SECRET_KEY you set.
STRIPE_PRICE_SILVER = "price_1TvCAyG0ICmhMX6mAvegjzCb"   # £15/mo individual
STRIPE_PRICE_GOLD   = "price_1TvCBcG0ICmhMX6mLuUwY3Qe"   # £20/mo individual

# Secrets are NOT stored here — set them with `wrangler secret put NAME`:
#   GROQ_SECRET                   (console.groq.com key — PRIMARY AI provider)
#   OPENROUTER_API_KEY            (your OpenRouter key — second rung)
#   NVIDIA_SECRET                 (build.nvidia.com key — last-resort rung)
#   SUPABASE_ANON_KEY             (publishable key — used to verify caller sessions)
#   SUPABASE_SERVICE_ROLE_KEY     (server-only — Stripe/email write to the DB)
#   STRIPE_SECRET_KEY             (sk_... — the sensitive one)
#   STRIPE_WEBHOOK_SECRET         (whsec_... — from the webhook endpoint)
#   GAS_EMAIL_URL     (Google Apps Script web-app URL — preferred, free email via Gmail)
#   GAS_EMAIL_SECRET  (shared secret that the Apps Script checks)
#   RESEND_API_KEY    (optional fallback if you don't use Apps Script)
